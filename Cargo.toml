[package]
name = "flowsurface"
version.workspace = true
readme = "README.md"
license = "GPL-3.0-or-later"
description = "A native desktop charting platform for crypto markets"
categories = ["finance", "visualization", "gui"]
edition.workspace = true
repository.workspace = true
homepage.workspace = true

[workspace.package]
version = "0.8.8"
edition = "2024"
repository = "https://github.com/flowsurface-rs/flowsurface"
homepage = "https://flowsurface.com"

[workspace]
members = [ "data", "exchange"]

[workspace.dependencies]
iced_core = { version = "0.14.0", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "now", "clock"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
thiserror = "2.0.18"
regex = "1.12.3"
palette = "0.7.6"
num-traits = "0.2.19"
rustc-hash = "2.1.2"
enum-map = "2.7.3"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
data = { version = "0.8.8", path = "data", package = "flowsurface-data" }
exchange = { version = "0.8.8", path = "exchange", package = "flowsurface-exchange" }

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tokio",
    "canvas",
    "sipper",
    "advanced",
    "unconditional-rendering",
    "crisp",
    "x11",
    "wayland",
] }
iced_core.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
uuid.workspace = true
palette.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true
enum-map.workspace = true
url.workspace = true
fern = "0.7.1"
rodio = { version = "0.22.2", default-features = false, features = [ "playback", "wav" ]}

bytemuck = "1.25.0"
rand = "0.10.1"
iced_wgpu = "0.14.0"
exchange.workspace = true
data.workspace = true

# WealthSpring 集成（docs/08）：自包含读 Redis（活动 run + 回测成交流），见 src/ws/。
# 不走 git 依赖主仓（私有 + 含本 fork 子模块 → 循环）；wire 契约简单稳定，内联读取（docs/03/07/08）。
redis = { version = "1", features = ["streams"] }
tokio = { version = "1", features = ["sync"] } # replay：阻塞 redis 线程 → async 订阅的桥
rmpv = "1" # 解码通道① events.* msgpack（OrderFilled/Position），F3 订单/PnL
rusqlite = { version = "0.32", features = ["bundled"] } # F6-P2 Factory pane：只读轮询 registry.sqlite
# F6-P3 Recorder pane：① 页脚取 num_rows（不需解压）；② ⑤ 按日覆盖要读 `ts_recv` 列。
#
# **必须开 zstd**：录制器用 ZSTD 写（`wealthspring-recorder/src/writer.rs`），
# 不开的话列读取全部静默失败（返回 Err，一行数据都读不出来）。
# 仍不引入 arrow——列读走 parquet 自己的 `ColumnReader`，不需要 arrow 那套。
#
# 为什么非读列不可：只读页脚 min/max 算出的「最长无洞段」比真值**高估 1.27~4.61 倍**
# （实测 2026-09-18：页脚 49.2 分钟 vs 真值 10.7 分钟）——段内的洞页脚看不见。
parquet = { version = "55", default-features = false, features = ["zstd"] }

[features]
debug = ["iced/hot"]
